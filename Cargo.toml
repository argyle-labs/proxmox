[package]
name = "proxmox"
version = "0.1.0"
edition = "2024"
description = "Proxmox VE plugin for orca — cluster nodes/guests with cluster_roster + topology ABI backends"
build = "build.rs"

[package.metadata.orca]
category = "infra"

[lib]
name = "proxmox"
path = "src/lib.rs"
# `rlib` retains the in-crate `#[cfg(test)]` harness + lets the workspace use it
# as a normal Rust lib. The plugin artifact is the `[[bin]]` below.
crate-type = ["rlib"]

# Plugin entrypoint: a subprocess `[[bin]]` that talks to the orca daemon over
# its Unix socket via `serve_tool_plugin!` from plugin-toolkit. No FFI/cdylib.
[[bin]]
name = "proxmox"
path = "src/main.rs"

# Proxmox VE plugin. `build.rs` turns the vendored upstream spec
# (`specs/proxmox.openapi.json`, derived from a cluster node's `apidoc.js`) into
# the api-surface table orca core's executor runs every `api::call` against.
# Refresh by overwriting `specs/apidoc.js` + `specs/proxmox.openapi.json`.
#
# Beyond its tool surface, this plugin contributes three domain backends over the
# subprocess wire protocol (see `src/registration.rs` + `src/main.rs`): a
# `cluster_roster` provider, a `topology` collector, and a `unit` provider (the
# five-verb vm/lxc surface). orca's loader registers all three into the matching `contract`
# registries, so a loaded proxmox plugin restores fleet cluster grouping +
# parent-host topology + guest lifecycle with no static link into orca.

[dependencies]
# The SOLE orca dependency. All macro-emitted paths (`#[orca_tool]`,
# `endpoint_resource!`, dispatch's `register_op!`) resolve through
# `::plugin_toolkit::*`, and every orca primitive the plugin source touches
# (schemars / clap / anyhow / inventory / db / rusqlite / async-trait /
# dispatch / contract / derive / macro-runtime / runtime / containers /
# api_client / http / urlencoding / futures_util / reqwest / tokio) is
# re-exported by the toolkit + its prelude.
#
# CI builds `--locked`. Thin profile: typed API ops go through core's executor
# (`api::call`); `delegated-http` carries the remaining raw-URL calls over orca's
# `http.request` capability, so this plugin links NO reqwest/rustls/hyper.
# `default-features = false` drops the real `http`/`openapi` stacks; `tools`
# (orca_tool anchors) + `db` (thin endpoint_resource CRUD over db_op) +
# `containers` (the domain proxmox registers) + `delegated-http` are all it
# needs. `secrets`/`serve`/`storage` are always-on. See [[plugins-stay-thin]].
plugin-toolkit = { version = "=0.2.1-rc.35", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "containers", "delegated-http"] }

# Light, genuinely-external deps the plugin source names at the crate root. None
# drags a transitive heavyweight.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"

# This plugin's hand-written source (carried over from the in-tree crate) names
# these crates fully-qualified — `schemars::JsonSchema` derives, `anyhow::Result`
# signatures, `tracing::warn!`, `tokio::` — rather than routing every reference
# through the toolkit prelude. They are pinned to the orca workspace major so
# cargo unifies each with the toolkit's same-version copy into a single crate
# instance (the `schemars::Schema` in `ToolDef` stays one type across the seam).
schemars    = { version = "1", features = ["derive"] }
anyhow      = "1"
tracing     = "0.1"
# Subprocess entrypoint only: format the plugin's own tracing to stderr, which
# orca's supervisor inherits. `env-filter` honors `RUST_LOG`.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio       = { version = "1", features = ["full"] }
# Parses an endpoint URL to decide whether it names this host.
url         = "2"
# Root-side guest file pull (guest_file.rs): openat/O_NOFOLLOW walks, fchown, statvfs.
libc        = "0.2"
# Streaming sha256 while copying; utils::hash only hashes whole buffers or paths.
sha2        = "0.10"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
# Spec-refresh tool only (examples/pve_to_openapi.rs + spec-tools/from_pve.rs):
# parse Proxmox's `apidoc.js` dialect into an `openapiv3` document. Proxmox-
# specific, so it lives here, not in orca's generic `openapi` crate.
openapiv3 = "2"
indexmap  = "2"
anyhow    = "1"
# PVE's own inittab getty regex, run in the guest-standard tests.
regex     = "1"
openapi   = { version = "=0.2.1-rc.35", registry = "gitea", package = "orca-openapi" }

[build-dependencies]
plugin-toolkit-build = { version = "=0.2.1-rc.35", registry = "gitea", package = "orca-plugin-toolkit-build" }
openapi = { version = "=0.2.1-rc.35", registry = "gitea", package = "orca-openapi" }

# Match orca's workspace lint floor: discarding a Result/Option via
# `let _ = ...` was a load-bearing past incident, so keep it a hard error here
# too — the plugin must stay portable back into the orca workspace.
[lints.clippy]
let_underscore_must_use = "deny"
