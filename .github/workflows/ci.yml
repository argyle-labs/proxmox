name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: argyle-labs/.github/.github/workflows/plugin-ci.yml@main
    secrets: inherit
    # One giant rustc (517 generated tool surfaces + 1261 JsonSchema types) OOMs
    # the runner unless the build is serialized and debuginfo dropped.
    with:
      build-jobs: '1'
      debuginfo: '0'
